workflows:
  ios-workflow:
    name: Look Away iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lookaway.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets and sync Capacitor iOS
        script: npm run cap:sync
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
